<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><meta name='theme-color' content='#000000'><title>Phone App Builder</title><style>:root{--pn:#16161a;--ac:#4da3ff;--ln:#2a2a31}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#000;color:#f2f2f2;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}#stage{position:fixed;inset:0;overflow:hidden}.el{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:600;user-select:none;-webkit-user-select:none;padding:4px;text-align:center;overflow:hidden}.el.sel{outline:2px dashed var(--ac)}#tab{position:fixed;left:0;top:45%;width:10px;height:70px;background:#ffffff22;border-radius:0 8px 8px 0;z-index:4}#chip{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:4;background:#ffffff22;color:#fff;border:0;border-radius:14px;padding:6px 12px;font-size:12px}#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none;max-width:80vw;text-align:center}#panel{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--pn);border-right:1px solid var(--ln);transform:translateX(-100%);transition:transform .2s;z-index:6;padding:max(12px,env(safe-area-inset-top)) 12px 12px;overflow-y:auto;touch-action:pan-y}#panel.open{transform:none}h3{margin:0 0 10px}button,select,input{font:inherit;color:#f2f2f2;background:#24242b;border:1px solid var(--ln);border-radius:10px;padding:9px 10px;margin:4px 0;width:100%}.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}.p{background:var(--ac);color:#001;border:0}.d{background:#7a2230;border:0}label{display:block;font-size:12px;opacity:.85;margin-top:6px}input[type=color]{height:40px;padding:2px}.hint{font-size:12px;opacity:.6}</style></head><body><div id='stage'></div><div id='tab'></div><button id='chip'>Edit</button><div id='toast'></div><div id='panel'><h3>Phone App Builder</h3><div class='row'><select id='scr'></select><button id='addscr'>+ Screen</button></div><input id='desc' placeholder='Describe it: big red button Start opens screen 2'><button id='add' class='p'>Add from text</button><div id='props'><label>Label<input id='lab'></label><label>Color<input id='col' type='color'></label><div class='row'><button data-s='S'>S</button><button data-s='M'>M</button><button data-s='L'>L</button></div><label>Tap action<select id='act'><option value='none'>None</option><option value='message'>Show message</option><option value='goto'>Go to screen</option><option value='vibrate'>Vibrate</option></select></label><input id='val' placeholder='Message or screen number'><button id='del' class='d'>Delete</button></div><div class='row'><button id='undo'>Undo</button><button id='save'>Save</button><button id='exp'>Export</button></div><button id='build' class='p'>Build app (exports spec)</button><p class='hint'>Swipe right from the left edge to open this panel. Swipe left on it to close. Tap Edit/Play (top right) to switch modes.</p></div><script>const $=s=>document.querySelector(s);const KEY='pab.project.v1';const COL={red:'#e53935',green:'#43a047',blue:'#1e88e5',yellow:'#fdd835',purple:'#8e24aa',orange:'#fb8c00',pink:'#ec407a',white:'#ffffff',gray:'#757575',grey:'#757575',black:'#222222',teal:'#00897b'};let S={screens:[{name:'Screen 1',els:[]}],cur:0},sel=null,edit=true,hist=[],drag=null;function scr(){return S.screens[S.cur]}function snap(){hist.push(JSON.stringify(S));if(hist.length>30)hist.shift()}function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.style.opacity=0},1800)}function undo(){if(!hist.length){toast('Nothing to undo');return}S=JSON.parse(hist.pop());if(S.cur>=S.screens.length)S.cur=0;sel=null;draw()}function draw(){const st=$('#stage');st.querySelectorAll('.el').forEach(e=>e.remove());scr().els.forEach(o=>{const e=document.createElement('div');e.className='el '+o.t+(o===sel&&edit?' sel':'');e.style.cssText='left:'+o.x+'px;top:'+o.y+'px;width:'+o.w+'px;height:'+o.h+'px;font-size:'+Math.max(12,Math.round(o.h/3))+'px;background:'+(o.t==='text'?'transparent':o.color)+';color:'+(o.t==='text'?o.color:'#fff');e.textContent=o.label;e.dataset.id=o.id;st.appendChild(e)});sync()}function sync(){$('#scr').innerHTML=S.screens.map((s,i)=>'<option value="'+i+'"'+(i===S.cur?' selected':'')+'>'+s.name+'</option>').join('');$('#props').style.display=sel?'block':'none';if(sel){$('#lab').value=sel.label;$('#col').value=sel.color.length===7?sel.color:'#1e88e5';$('#act').value=sel.act.type;$('#val').value=sel.act.val||''}$('#chip').textContent=edit?'Edit':'Play';try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function runAct(o){const a=o.act;if(a.type==='message')toast(a.val||o.label);else if(a.type==='goto'){const i=parseInt(a.val,10)-1;if(S.screens[i]){S.cur=i;sel=null;draw()}else toast('No screen '+a.val)}else if(a.type==='vibrate'){if(navigator.vibrate)navigator.vibrate(80);toast('Vibrate')}}function parse(txt){const lo=txt.toLowerCase();const s=' '+lo.replace(/[^a-z0-9 ]/g,' ')+' ';const has=w=>s.includes(' '+w+' ');const o={id:Math.random().toString(36).slice(2),t:'button',x:40,y:Math.min(innerHeight-120,80+scr().els.length*20),w:160,h:56,label:'Button',color:'#1e88e5',act:{type:'none',val:''}};if((has('text')||has('label')||has('title'))&&!has('button')){o.t='text';o.label='Text';o.color='#ffffff'}for(const k in COL)if(has(k))o.color=COL[k];if(has('big')||has('large')){o.w=240;o.h=84}if(has('small')||has('tiny')){o.w=100;o.h=40}let t=txt,msg=null;let i=lo.indexOf('message');if(i<0)i=lo.indexOf('toast');let j=lo.indexOf('show');if(j<0)j=lo.indexOf('display');if(i>=0&&j>=0&&j<i){msg=txt.slice(i+(lo.indexOf('toast')===i?5:7)).trim().replace(/^[\"'“‘]+|[\"'”’]+$/g,'');t=txt.slice(0,j)}const qi=t.search(/[\"“‘]/);if(qi>=0){const r=t.slice(qi+1);const e=r.search(/[\"”’]/);const l=(e>=0?r.slice(0,e):r).trim();if(l)o.label=l}else{for(const k of['called','named','labeled','says','saying','reads']){const n=(' '+t.toLowerCase()+' ').indexOf(' '+k+' ');if(n>=0){let r=t.slice(n+k.length+1);for(const w of['that','which','and','then','opens','open','goes','go','shows','vibrates']){const m=(' '+r.toLowerCase()+' ').indexOf(' '+w+' ');if(m>=0)r=r.slice(0,m)}r=r.trim();if(r)o.label=r;break}}}if(msg!==null)o.act={type:'message',val:msg};else{const g=s.split(' ').filter(Boolean);const gi=g.findIndex((w,x)=>(w==='screen'||w==='page')&&/^[0-9]+$/.test(g[x+1]||''));if(gi>=0&&(has('open')||has('opens')||has('go')||has('goes')||has('goto')||has('switch')||has('navigate')))o.act={type:'goto',val:g[gi+1]};else if(s.includes('vibrat'))o.act={type:'vibrate',val:''}}return o}function exportSpec(n){const b=new Blob([JSON.stringify({app:'phone-app-builder',version:1,screens:S.screens},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#lab').onchange=e=>{if(!sel)return;snap();sel.label=e.target.value;draw()};$('#col').onchange=e=>{if(!sel)return;snap();sel.color=e.target.value;draw()};$('#act').onchange=e=>{if(!sel)return;snap();sel.act.type=e.target.value;draw()};$('#val').onchange=e=>{if(!sel)return;snap();sel.act.val=e.target.value;draw()};document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(!sel)return;snap();const z={S:[100,40],M:[160,56],L:[240,84]}[b.dataset.s];sel.w=z[0];sel.h=z[1];draw()});$('#del').onclick=()=>{if(!sel)return;snap();scr().els=scr().els.filter(x=>x!==sel);sel=null;draw()};$('#add').onclick=()=>{const v=$('#desc').value.trim();if(!v)return;snap();const o=parse(v);scr().els.push(o);sel=o;$('#desc').value='';draw()};$('#addscr').onclick=()=>{snap();S.screens.push({name:'Screen '+(S.screens.length+1),els:[]});S.cur=S.screens.length-1;sel=null;draw()};$('#scr').onchange=e=>{S.cur=+e.target.value;sel=null;draw()};$('#undo').onclick=undo;$('#save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));toast('Saved')}catch(e){toast('Could not save')}};$('#exp').onclick=()=>{exportSpec('app-spec.json');toast('Exported')};$('#build').onclick=()=>{exportSpec('build-spec.json');toast('Spec exported. AI build step comes next.')};$('#chip').onclick=()=>{edit=!edit;sel=null;draw()};const P=$('#panel');const open=v=>P.classList.toggle('open',v);$('#tab').onclick=()=>open(true);let gx=null,px=null;document.addEventListener('pointerdown',e=>{if(!P.classList.contains('open')&&e.clientX<28)gx=e.clientX;if(P.contains(e.target))px=e.clientX});document.addEventListener('pointermove',e=>{if(gx!==null&&e.clientX-gx>60){open(true);gx=null}if(px!==null&&e.clientX-px<-60){open(false);px=null}});$('#stage').addEventListener('pointerdown',e=>{const el=e.target.closest('.el');if(!el){if(edit&&sel){sel=null;draw()}return}const o=scr().els.find(x=>x.id===el.dataset.id);if(!o)return;if(!edit){runAct(o);return}sel=o;drag={o:o,dx:e.clientX-o.x,dy:e.clientY-o.y,m:0};draw()});document.addEventListener('pointermove',e=>{if(!drag)return;const o=drag.o;if(!drag.m){snap();drag.m=1}o.x=Math.max(0,Math.min(innerWidth-o.w,e.clientX-drag.dx));o.y=Math.max(0,Math.min(innerHeight-o.h,e.clientY-drag.dy));const n=document.querySelector('[data-id="'+o.id+'"]');if(n){n.style.left=o.x+'px';n.style.top=o.y+'px'}});document.addEventListener('pointerup',()=>{gx=null;px=null;if(drag){drag=null;sync()}});try{const j=localStorage.getItem(KEY);if(j){const p=JSON.parse(j);if(p&&p.screens&&p.screens.length)S=p}}catch(e){}draw();</script></body></html>
